<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1 align="center">Student Registration Form</h1>
    
    <form action="submit.html" method="post">
        <!-- Full Name -->
        <p>
            <label>Full Name: </label>
            <input type="text" name="fullname" placeholder="Enter Name" required>
        </p>

        <!-- Email (with Email Validation) -->
        <p>
            <label>Email: </label>
            <input type="email" name="email" placeholder="abc@example.com" required>
        </p>

        <!-- Contact No -->
        <p>
            <label>Contact No: </label>
            <input type="tel" name="contact" placeholder="Enter phone number" required>
        </p>

        <!-- Address (Textarea) -->
        <p>
            <label>Address: </label><br>
            <textarea name="address" rows="4" cols="40" placeholder="Enter your address" required></textarea>
        </p>

        <!-- Submit and Reset -->
        <p>
            <input type="submit" value="Register">
            <input type="reset" value="Clear">
        </p>
    </form>
    
    <hr>
    <p align="center">&copy; 2025 Student Registration Portal</p>
</body>
</html>
